<!doctype html>
<html lang="en">
  <head>
    <title>Movie-CRUD</title>
    <meta charset="utf-8">
    <meta name="description" content="Movie CRUD Application using Angular and Bootstrap">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      #splash{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgb(4, 0, 0);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-family: sans-serif;
        z-index: 9999;
        transition: opacity 1s ease;
      }
      #splash-fade{
        opacity: 0;
        pointer-events: none;
      }
      .splash-screen{
        position: absolute;
        inset: 0;
        background: black;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      .mybtn{
        position: relative;
        width: 1900px;
        height: 400px;
        display: flex;
        align-items: center;
        background: rgb(4, 0, 0);
        cursor: pointer;
        justify-content: center;
        border-radius: 10px;
        transition: 0.5s;
        overflow: hidden;
        font-size: 4rem;
        text-decoration: none;
        text-transform: uppercase;
        color: red;
      }
      .mybtn:hover{
          filter: drop-shadow(0 0 10px red) drop-shadow(0 0 30px red);
          color: white;
          letter-spacing: 0.2em;
      }
      .mybtn span{
        position: absolute;
        top: 0;
        width: 10px;
        height:100%;
        background: red;
        pointer-events: none;
        transition: transform 0.2s ease-in-out;
        z-index: -1;
        transform: scaleY(0);
        transform-origin: bottom;
      }

      .mybtn:hover span{
        transform: scaleY(1);
        transform-origin:top;
      }

      .mybtn span:nth-child(even){
        transform-origin: top;
      }

      .mybtn:hover span:nth-child(even){

        transform-origin: bottom;
      }

    </style>
  </head>
  <body>
    <div id="splash" class="splash-screen">
      <div class="container">
        <a href="a" class="mybtn">MovieFlix</a>
      </div>   
    </div>
    <app-root></app-root>

    <script>
      window.addEventListener('DOMContentLoaded',function(){
        
        let btns=document.querySelectorAll('.mybtn');
        btns.forEach(function(mybtn){
          let spans=[]
          for(let i=0;i<120;i++){
            let span=document.createElement('span');
            span.style.left= `${i*16}px`;
            spans.push(span);
            mybtn.appendChild(span);
            let randomly=(Math.random()*1)+0;
            span.style.transitionDelay=randomly+'s';
          }
        })

        setTimeout(() =>{
          const splash = document.getElementById('splash');
          splash.style.opacity = '0';
          setTimeout(() => splash.remove(), 1000);
        } ,3000);
      });
    </script>
  </body>
</html>
